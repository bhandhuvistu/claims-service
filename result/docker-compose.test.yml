version: '2'

services:

  sut:
    build: ./tests/
    depends_on:
      - health-insurance-system
      - claims-service
      - policy-service
    networks:
      - front-tier

  health-insurance-system:
    build: ../health-insurance-system/
    ports: ["80"]
    depends_on:
      - redis
      - db
    networks:
      - front-tier
      - back-tier

  claims-service:
    build: .
    ports: ["80"]
    depends_on:
      - redis
      - db
    networks:
      - front-tier
      - back-tier

  policy-service:
    build: ../policy-service/
    depends_on:
      - redis
      - db
    networks:
      - back-tier

  redis:
    image: redis:alpine
    networks:
      - back-tier

  db:
    image: postgres:9.4
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
  db-data:

networks:
  front-tier:
  back-tier:
